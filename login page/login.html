<DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device">
        <title>A Login Website</title>
        <link rel="stylesheet" href="./login.css">
    </head>
    <body>
        <img id="logo" src="./project.png" alt="Online Academy Logo">
        <div class="container">
            <p>STUDENT LOGIN</p>
            <hr id="line">
            <br>

            <form class="form">
                <label for="id">Identity Number:</label><br>
                <input class="input" type="number" id="id" name="id-number" placeholder="Student/Applicant" required>
                <br><br>

               <label for="psw">Password:</label><br>
               <input class="input" type="password" id="psw" name="password" placeholder="Password" required><br>

               <p id="forget">Forget Password?</p>

               <button id="btn" type="submit">Login</button>
            </form>
        </div>
    </body>
</html>
